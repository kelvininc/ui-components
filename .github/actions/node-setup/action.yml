name: Setup Node.js Project
description: Configures Node.js, fetches dependencies, and manages caching.

inputs:
    node-version:
        required: true
        description: Node.js version to set up

runs:
    using: "composite"
    steps:
        # No `version` input: the action reads the `packageManager` field from
        # the root package.json, so the pnpm version lives in exactly one place.
        - name: Install pnpm
          uses: pnpm/action-setup@v6

        - name: Setup Node.js
          uses: actions/setup-node@v7
          with:
              node-version: ${{ inputs.node-version }}
              cache: "pnpm"

        - name: Install dependencies
          shell: bash
          run: pnpm install
          env:
              PUPPETEER_SKIP_DOWNLOAD: true

        # A Puppeteer release pins exactly one Chrome build, so the resolved
        # version is the correct cache key. Must run after `pnpm install`.
        - name: Resolve Puppeteer version
          id: puppeteer
          shell: bash
          working-directory: packages/ui-components
          run: echo "version=$(node -p "require('puppeteer/package.json').version")" >> "$GITHUB_OUTPUT"

        - name: Setup chrome binary cache
          uses: actions/cache@v6
          with:
              path: ~/.cache/puppeteer/
              key: ${{ runner.os }}-chrome-puppeteer-${{ steps.puppeteer.outputs.version }}

        - name: Download chrome binary
          shell: bash
          working-directory: packages/ui-components/node_modules/puppeteer
          run: pnpm postinstall
