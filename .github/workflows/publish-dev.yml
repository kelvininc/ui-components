name: publish-dev

on:
    push:
        branches:
            - dev

permissions:
    contents: write # for checkout and tag

jobs:
    publish:
        strategy:
            matrix:
                os: [ubuntu-24.04]
                node: [24.x]

        name: Lint, Test & Build (${{ matrix.os }} / Node.js ${{ matrix.node }})
        runs-on: ${{ matrix.os }}
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  token: ${{ secrets.GITHUB_TOKEN }}

            - name: Setup Node.js ${{ matrix.node }}
              uses: ./.github/actions/node-setup
              with:
                  node-version: ${{ matrix.node }}
              env:
                  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

            - name: Lint
              run: pnpm lint

            - name: Test
              run: pnpm --filter @kelvininc/ui-components test

            - name: Build
              run: pnpm build:packages
              env:
                  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

            - name: Test React
              run: pnpm --filter @kelvininc/react-ui-components test

    # Same job as in publish-master.yml
    storybook:
        needs: [publish]
        strategy:
            matrix:
                os: [ubuntu-24.04]
                node: [24.x]

        name: Publish Alpha & Master Storybook (${{ matrix.os }} / Node.js ${{ matrix.node }})
        runs-on: ${{ matrix.os }}
        permissions:
            contents: write # to push gh-pages
        # publish-dev and publish-master both force-push gh-pages, so their deploys take turns. A newer
        # deploy may replace a pending one, which loses nothing: each builds the latest master and dev
        concurrency:
            group: storybook-pages
            cancel-in-progress: false
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Setup Node.js ${{ matrix.node }}
              uses: ./.github/actions/node-setup
              with:
                  node-version: ${{ matrix.node }}

            # Exactly one `--`: lerna hands what follows it to storybook-to-ghpages. Any extra `--`
            # reaches the deployer too, which then ignores every flag after it and deploys each call
            - name: Publish Alpha & Master Storybook to GitHub Pages
              run: |
                  git switch -f master
                  pnpm install
                  pnpm build:packages
                  pnpm storybook:deploy -- --out='./gp' --dry-run
                  git switch -f dev
                  pnpm install
                  pnpm build:packages
                  pnpm storybook:deploy -- --out='./gp/alpha' --dry-run
                  pnpm storybook:deploy -- --existing-output-dir='./gp'
              env:
                  GH_TOKEN: ${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}

    summary:
        name: Publish Dev Summary
        runs-on: ubuntu-24.04
        needs: [publish, storybook]
        if: always()
        steps:
            - name: Generate workflow summary
              run: |
                  cat >> $GITHUB_STEP_SUMMARY << 'EOF'
                  # Kelvin UI Components - Publish Dev Summary

                  ## 📦 Deployment Information
                  - **Commit**: `${{ github.sha }}`
                  - **Branch**: `${{ github.ref_name }}`
                  - **Environment**: Storybook (GitHub Pages)

                  ## Component Status

                  | Component | Status |
                  |-----------|---------|
                  | Validate (Lint + Test + Build) | ${{ needs.publish.result == 'success' && '✅ Success' || needs.publish.result == 'skipped' && '⏭️ Skipped' || '❌ Failed' }} |
                  | Storybook (Build master + dev + Deploy to GitHub Pages) | ${{ needs.storybook.result == 'success' && '✅ Success' || needs.storybook.result == 'skipped' && '⏭️ Skipped' || needs.storybook.result == 'cancelled' && '⏹️ Replaced by a newer deploy' || '❌ Failed' }} |

                  ## Deployment Summary
                  - **Master Storybook**: ${{ needs.storybook.result == 'success' && '💅 Deployed to /' || needs.storybook.result == 'skipped' && '⏭️ Skipped' || needs.storybook.result == 'cancelled' && '⏹️ Replaced by a newer deploy' || '❌ Failed' }}
                  - **Alpha (Dev) Storybook**: ${{ needs.storybook.result == 'success' && '💅 Deployed to /alpha' || needs.storybook.result == 'skipped' && '⏭️ Skipped' || needs.storybook.result == 'cancelled' && '⏹️ Replaced by a newer deploy' || '❌ Failed' }}

                  ---

                  > 🚀 **Storybook Updated**: The alpha storybook has been refreshed from the `dev` branch alongside the latest `master` storybook.
                  EOF
