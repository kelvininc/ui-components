<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <title>storybook - Storybook</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    
    <style>
      @font-face {
        font-family: 'Nunito Sans';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('./sb-common-assets/nunito-sans-regular.woff2') format('woff2');
      }

      @font-face {
        font-family: 'Nunito Sans';
        font-style: italic;
        font-weight: 400;
        font-display: swap;
        src: url('./sb-common-assets/nunito-sans-italic.woff2') format('woff2');
      }

      @font-face {
        font-family: 'Nunito Sans';
        font-style: normal;
        font-weight: 700;
        font-display: swap;
        src: url('./sb-common-assets/nunito-sans-bold.woff2') format('woff2');
      }

      @font-face {
        font-family: 'Nunito Sans';
        font-style: italic;
        font-weight: 700;
        font-display: swap;
        src: url('./sb-common-assets/nunito-sans-bold-italic.woff2') format('woff2');
      }
    </style>

    <link href="./sb-manager/runtime.js" rel="modulepreload" />

      <link rel="shortcut icon" href="/favicon.ico">
<link rel="icon" type="image/png" href="/kelvin-icon.png" sizes="192x192">
<script>
	// Overwrite the default title - cannot be set in the API
	document.title = 'UI Components';
</script>
<style>
	:root {
		color-scheme: dark;
	}

	.sidebar-header div a:focus {
		border: none
	}

	/* Storybook 10 lays the brand link out as a flex row; stack the label under the logo */
	.sidebar-header div a {
		flex-direction: column;
		align-items: flex-start;
	}

	.sidebar-header div a::after {
		content: 'UI Components';
		display: flex;
		align-self: stretch;
		justify-content: flex-end;
		color: grey;
		font-family: var(--kv-primary-font, 'Proxima Nova', sans-serif, 'Arial');
		font-size: 14px;
		font-weight: 300;
		font-stretch: normal;
		font-style: normal;
		line-height: normal;
		letter-spacing: normal;
	}

	.addon-notes-container p code {
		line-height: 1;
		padding: 3px 5px !important;
		border: 1px solid #444444 !important;
		color: rgba(255, 255, 255, 0.7) !important;
		background-color: rgba(0, 0, 0, .1) !important;
	}

	.addon-notes-container table {
		display: block;
		overflow-x: auto;
	}

	.addon-notes-container table td code {
		white-space: pre-wrap;
		word-wrap: break-word;
		padding: 3px 5px !important;
		border: 1px solid #444444 !important;
		color: rgba(255, 255, 255, 0.7) !important;
		background-color: rgba(0, 0, 0, .1) !important;
	}

	.addon-notes-container table tr {
		background-color: transparent !important;
	}

	.addon-notes-container table tr:nth-of-type(2n) {
		background-color: transparent !important;
	}
</style>
 

    <style>
      #storybook-root[hidden] {
        display: none !important;
      }
    </style>

    
  </head>
  <body>
    <div id="root"></div>

    
    <script>
      
        
          window['FEATURES'] = {
  "actions": true,
  "argTypeTargetsV7": true,
  "babelRemoveBugfixes": false,
  "backgrounds": true,
  "changeDetection": true,
  "componentsManifest": true,
  "controls": true,
  "disallowImplicitActionsInRenderV8": true,
  "highlight": true,
  "interactions": true,
  "legacyDecoratorFileOrder": false,
  "measure": true,
  "outline": true,
  "menuOnboardingChecklist": true,
  "sidebarOnboardingChecklist": true,
  "viewport": true,
  "experimentalReactComponentMeta": true
};
        
      
        
          window['REFS'] = {};
        
      
        
          window['LOGLEVEL'] = "info";
        
      
        
          window['DOCS_OPTIONS'] = {
  "defaultName": "Docs"
};
        
      
        
          window['CONFIG_TYPE'] = "PRODUCTION";
        
      
        
          window['DOCGEN_STORY_PREPARED'] = false;
        
      
        
      
        
      
        
          window['TAGS_OPTIONS'] = {};
        
      
        
          window['STORYBOOK_BUILDER'] = "webpack5";
        
      
        
          window['STORYBOOK_FRAMEWORK'] = "react-webpack5";
        
      
        
          window['STORYBOOK_RENDERER'] = "react";
        
      
        
      
    </script>
    

    <script type="module">
      import './sb-manager/globals-runtime.js';

      
        import './sb-addons/storybook-core-server-presets-0/common-manager-bundle.js';
      
        import './sb-addons/links-1/manager-bundle.js';
      
        import './sb-addons/docs-2/manager-bundle.js';
      
        import './sb-addons/themes-3/manager-bundle.js';
      
        import './sb-addons/storybook-4/manager-bundle.js';
      

      import './sb-manager/runtime.js';
    </script>
  </body>
</html>
